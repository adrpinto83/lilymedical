services:
  postgres:
    image: postgres:16-alpine
    container_name: lilymedical-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lilymedical
      POSTGRES_PASSWORD: lilymedical
      POSTGRES_DB: lilymedical
    ports:
      - "5432:5432"
    volumes:
      - lilymedical_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lilymedical"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lilymedical_pgdata:
